name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: style_companion
          POSTGRES_USER: style_companion
          POSTGRES_PASSWORD: style_companion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U style_companion -d style_companion"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      DATABASE_URL: postgresql://style_companion:style_companion@localhost:5432/style_companion?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @style-companion/api prisma:generate

      - name: Validate Prisma schema
        run: pnpm --filter @style-companion/api prisma:validate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify Dockerfiles build
        run: |
          docker build -f apps/api/Dockerfile -t style-companion-api:ci .
          docker build -f apps/admin/Dockerfile -t style-companion-admin:ci .
